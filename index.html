<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Certification Carousel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: only light;
        --bg-color: #0e1a27;
        --text-color: #f0f4f8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at top, #16324f, var(--bg-color));
        font-family: "Poppins", sans-serif;
        color: var(--text-color);
      }

      .ticker {
        position: relative;
        width: min(92vw, 1080px);
        padding: 42px 0;
        border-radius: 32px;
        overflow: hidden;
        background: linear-gradient(135deg, rgba(15, 44, 75, 0.8), rgba(14, 26, 39, 0.92));
        box-shadow: 0 32px 80px rgba(0, 0, 0, 0.45);
      }

      .ticker::before,
      .ticker::after {
        content: "";
        position: absolute;
        top: 0;
        width: 120px;
        height: 100%;
        pointer-events: none;
        z-index: 2;
      }

      .ticker::before {
        left: 0;
        background: linear-gradient(90deg, rgba(14, 26, 39, 0.85), transparent);
      }

      .ticker::after {
        right: 0;
        background: linear-gradient(-90deg, rgba(14, 26, 39, 0.85), transparent);
      }

      .ticker-title {
        position: absolute;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 18px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.65);
        z-index: 3;
        white-space: nowrap;
      }

      .ticker-track {
        display: flex;
        align-items: center;
        gap: 56px;
        padding: 0 56px;
        width: max-content;
        animation: scroll 26s linear infinite;
      }

      .ticker-track:hover {
        animation-play-state: paused;
      }

      .ticker-track-wrapper {
        display: flex;
        width: fit-content;
      }

      .badge {
        width: clamp(92px, 12vw, 128px);
        height: clamp(92px, 12vw, 128px);
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.14);
        display: grid;
        place-items: center;
        padding: clamp(12px, 2vw, 20px);
        transition: transform 0.35s ease, box-shadow 0.35s ease, background 0.35s ease;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(4px);
      }

      .badge:hover {
        transform: translateY(-10px) scale(1.04);
        box-shadow: 0 16px 42px rgba(0, 0, 0, 0.35);
        background: rgba(255, 255, 255, 0.18);
      }

      .badge img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        filter: drop-shadow(0 12px 18px rgba(0, 0, 0, 0.35));
      }

      .ticker-content {
        display: flex;
        gap: 56px;
        padding: 0 56px;
        width: max-content;
        animation: scroll 26s linear infinite;
      }

      .ticker-content:hover {
        animation-play-state: paused;
      }

      @keyframes scroll {
        0% {
          transform: translateX(0);
        }
        100% {
          transform: translateX(-50%);
        }
      }
    </style>
  </head>
  <body>
    <section class="ticker" aria-label="Autorités et certifications">
      <p class="ticker-title">Autorités &amp; Certifications</p>
      <div class="ticker-content">
        <div class="badge" role="listitem">
          <img
            src="https://cdn.zenamoroccan.com/image/catalog/Homepage/AuthorizedBy/4-2.png"
            alt="Ministere de l'Agriculture du Maroc"
          />
        </div>
        <div class="badge" role="listitem">
          <img
            src="https://cdn.zenamoroccan.com/image/catalog/Homepage/AuthorizedBy/5.png"
            alt="ONSSA"
          />
        </div>
        <div class="badge" role="listitem">
          <img
            src="https://cdn.zenamoroccan.com/image/catalog/Homepage/AuthorizedBy/3-2.png"
            alt="Agriculture Biologique"
          />
        </div>
        <div class="badge" role="listitem">
          <img
            src="https://cdn.zenamoroccan.com/image/catalog/Homepage/AuthorizedBy/30.png"
            alt="Certification internationale"
          />
        </div>
        <div class="badge" aria-hidden="true">
          <img
            src="https://cdn.zenamoroccan.com/image/catalog/Homepage/AuthorizedBy/4-2.png"
            alt=""
          />
        </div>
        <div class="badge" aria-hidden="true">
          <img
            src="https://cdn.zenamoroccan.com/image/catalog/Homepage/AuthorizedBy/5.png"
            alt=""
          />
        </div>
        <div class="badge" aria-hidden="true">
          <img
            src="https://cdn.zenamoroccan.com/image/catalog/Homepage/AuthorizedBy/3-2.png"
            alt=""
          />
        </div>
        <div class="badge" aria-hidden="true">
          <img
            src="https://cdn.zenamoroccan.com/image/catalog/Homepage/AuthorizedBy/30.png"
            alt=""
          />
        </div>
      </div>
    </section>
  </body>
</html>
